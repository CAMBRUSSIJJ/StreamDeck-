name: Nexus Deck CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: PWA checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Install web dependencies
        working-directory: apps/deck
        run: npm install --no-audit --no-fund
      - name: Build Vercel web + Nexus Relay
        working-directory: apps/deck
        run: npm run build

  companion:
    name: Companion + Setup Windows x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test
        working-directory: apps/companion
        run: go test ./...
      - name: Vet
        working-directory: apps/companion
        run: go vet ./...
      - name: Build Windows x64
        working-directory: apps/companion
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../../dist ./cmd/nexus-installer/payload
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../../dist/NexusDeck-Companion.exe ./cmd/nexus-deck
          cp ../../dist/NexusDeck-Companion.exe ./cmd/nexus-installer/payload/NexusDeck-Companion.exe
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../../dist/NexusDeck-Setup.exe ./cmd/nexus-installer
          sha256sum ../../dist/NexusDeck-Companion.exe > ../../dist/NexusDeck-Companion.exe.sha256
          sha256sum ../../dist/NexusDeck-Setup.exe > ../../dist/NexusDeck-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NexusDeck-Windows-x64
          path: |
            dist/NexusDeck-Companion.exe
            dist/NexusDeck-Companion.exe.sha256
            dist/NexusDeck-Setup.exe
            dist/NexusDeck-Setup.exe.sha256
          if-no-files-found: error
