name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Sync local Deck
        run: npm run sync:local-deck
      - name: Test
        working-directory: apps/companion
        run: go test ./...
      - name: Build Companion + Setup
        working-directory: apps/companion
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../../dist ./cmd/nexus-installer/payload
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../../dist/NexusDeck-Companion.exe ./cmd/nexus-deck
          cp ../../dist/NexusDeck-Companion.exe ./cmd/nexus-installer/payload/NexusDeck-Companion.exe
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../../dist/NexusDeck-Setup.exe ./cmd/nexus-installer
      - name: SHA256
        run: |
          sha256sum dist/NexusDeck-Companion.exe > dist/NexusDeck-Companion.exe.sha256
          sha256sum dist/NexusDeck-Setup.exe > dist/NexusDeck-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NexusDeck-${{ github.ref_name }}-Windows-x64
          path: |
            dist/NexusDeck-Companion.exe
            dist/NexusDeck-Companion.exe.sha256
            dist/NexusDeck-Setup.exe
            dist/NexusDeck-Setup.exe.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/NexusDeck-Companion.exe dist/NexusDeck-Companion.exe.sha256 dist/NexusDeck-Setup.exe dist/NexusDeck-Setup.exe.sha256 --generate-notes
